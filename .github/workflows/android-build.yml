# Builds the Android app (Trusted Web Activity for musicaltripplanner.com) with Bubblewrap.
# Run it from GitHub: Actions -> "Android app build" -> Run workflow.
# Output (Actions run page -> Artifacts): app-release-bundle.aab for Google Play, and an APK for
# installing directly on a test phone.
#
# The app only wraps the live site, so site changes need no new build. Rebuild only to change the
# app itself (name, icons, colours, version). Before each Play upload, raise appVersionCode (and
# appVersion) in android/twa-manifest.json: Play rejects a version code it has seen before.
#
# Signing uses the UPLOAD key, from two repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload-key.jks file, base64-encoded
#   ANDROID_UPLOAD_KEY_PASSWORD     its password (same for the keystore and the key, alias "upload")
# Without the secrets the workflow still builds, unsigned (useful only to check the pipeline).
name: Android app build

on:
  workflow_dispatch:
  push:
    branches: [android-build]
    paths: ['android/**', '.github/workflows/android-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUBBLEWRAP_VERSION: 1.27.0
      BUILD_TOOLS: 36.1.0
      PLATFORM: android-36
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bubblewrap and the Android build tools
        run: |
          npm install -g @bubblewrap/cli@${BUBBLEWRAP_VERSION}
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;${BUILD_TOOLS}" "platforms;${PLATFORM}" > /dev/null
          # Bubblewrap checks for <sdk>/tools or <sdk>/bin; the runner's SDK keeps them under cmdline-tools.
          if [ ! -e "$ANDROID_HOME/bin" ] && [ ! -e "$ANDROID_HOME/tools" ]; then
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Generate the Android project from android/twa-manifest.json
        run: |
          mkdir -p build-android
          cp android/twa-manifest.json build-android/
          cd build-android
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Restore the upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > build-android/upload-key.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set: building an UNSIGNED bundle (cannot be uploaded to Play)."
          fi

      - name: Build
        working-directory: build-android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
            keytool -list -v -keystore upload-key.jks -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias upload | grep 'SHA256:' || true
            rm -f upload-key.jks
          else
            bubblewrap build --skipPwaValidation --skipSigning --manifest=./twa-manifest.json
          fi
          ls -la *.aab *.apk

      - uses: actions/upload-artifact@v5
        with:
          name: musical-trip-planner-android-${{ github.run_number }}
          path: |
            build-android/*.aab
            build-android/*.apk
            build-android/twa-manifest.json
          if-no-files-found: error
          retention-days: 30
